<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2D3139" stroke-width="4"/>

  <!-- Subtle Chart Grid Line -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#252933" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="64" y1="360" x2="448" y2="360" stroke="#1F232B" stroke-width="2"/>
  <line x1="64" y1="152" x2="448" y2="152" stroke="#1F232B" stroke-width="2"/>

  <!-- Candle 1: Bullish Green -->
  <g filter="url(#neonGlow)">
    <!-- Wick -->
    <line x1="140" y1="180" x2="140" y2="380" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="116" y="220" width="48" height="120" rx="8" fill="url(#bullGrad)"/>
  </g>

  <!-- Candle 2: Bearish Red -->
  <g>
    <!-- Wick -->
    <line x1="236" y1="140" x2="236" y2="340" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="212" y="170" width="48" height="100" rx="8" fill="url(#bearGrad)"/>
  </g>

  <!-- Candle 3: Large Bullish Cyan/Green breakout -->
  <g filter="url(#neonGlow)">
    <!-- Wick -->
    <line x1="332" y1="90" x2="332" y2="390" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="306" y="130" width="52" height="190" rx="10" fill="url(#cyanGrad)"/>
  </g>

  <!-- Trailing Animation Trend Sparkline -->
  <path d="M 100 320 Q 200 300 236 220 T 370 120 T 430 80" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.75"/>
  <circle cx="430" cy="80" r="8" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
